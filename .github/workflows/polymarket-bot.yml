name: Polymarket Bot

on:
  pull_request:
    branches: [main]
    paths:
      - "bot/**"
      - "tests/**"
      - "config/**"
      - "requirements*.txt"
      - ".github/workflows/polymarket-bot.yml"
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "tests/**"
      - "config/**"
      - "requirements*.txt"
      - ".github/workflows/polymarket-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot-tests:
    name: Bot tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4ea3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run bot test suite
        run: python -m pytest tests/ -q

      - name: Byte-compile launcher contract (CRLF check)
        run: |
          python - << 'PY'
          from pathlib import Path
          for name in ("start_bot.bat", "start_bot_background.bat", "stop_bot.bat"):
              data = Path(name).read_bytes()
              assert b"\r\n" in data, f"{name}: bukan CRLF"
              data.decode("ascii")
          print("bat CRLF+ASCII OK")
          PY
