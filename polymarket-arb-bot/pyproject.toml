[project]
name = "polymarket-arb-bot"
version = "0.1.0"
description = "Polymarket arbitrage detector/executor with full cost modelling (paper-first)."
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "websockets==17.3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.2",
    "ruff==0.17.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["polymarket_arb"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Decimal(...) defaults in frozen dataclasses are immutable values; RUF009 does not apply.
ignore = ["RUF009"]
