<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>PO Pilot — Stocky is gone</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Sans";
        src:
          local("Inter"),
          local("SF Pro Text"),
          local("Segoe UI"),
          local("Helvetica Neue"),
          local("DejaVu Sans"),
          local("Liberation Sans");
      }
      @font-face {
        font-family: "Mono";
        src:
          local("SF Mono"),
          local("Menlo"),
          local("Consolas"),
          local("DejaVu Sans Mono"),
          local("Liberation Mono");
      }
      :root {
        --ground: #0a0c10;
        --accent: #4ade80;
        --accent-2: #22d3ee;
        --danger: #f87171;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(1100px 620px at 78% -12%, rgba(34, 211, 238, 0.12), transparent 62%),
          radial-gradient(900px 560px at 8% 4%, rgba(74, 222, 128, 0.09), transparent 58%),
          var(--ground);
      }
      /* scene hosts */
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="s1"
        class="scene"
        data-composition-id="s1"
        data-composition-src="compositions/s1.html"
        data-start="0"
        data-duration="6"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s2"
        class="scene"
        data-composition-id="s2"
        data-composition-src="compositions/s2.html"
        data-start="6"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s3"
        class="scene"
        data-composition-id="s3"
        data-composition-src="compositions/s3.html"
        data-start="12"
        data-duration="6"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="s4"
        class="scene"
        data-composition-id="s4"
        data-composition-src="compositions/s4.html"
        data-start="18"
        data-duration="6"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
